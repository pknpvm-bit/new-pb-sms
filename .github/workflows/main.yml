name: Build Debug APK

on:
  push:
    branches:
      - "**"
workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK & Licenses
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
mkdir -p "$SDK_DIR/licenses"
          if command -v sdkmanager>/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: Locate Android project directory
        id: locate_project
        run: |
          set -e
          GRADLE_FILE="$(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1 || true)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "No build.gradle or build.gradle.kts found in repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate_project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
chmod +x ./gradlew
            ./gradlewassembleDebug --refresh-dependencies --stacktrace
          else
gradleassembleDebug --refresh-dependencies --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
