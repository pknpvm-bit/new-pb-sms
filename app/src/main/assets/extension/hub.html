<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSP-SMS</title><link rel="stylesheet" href="hub.css"><script src="chrome-compat.js"></script></head><body><div id="miniRestore" title="Open BSP-SMS">B</div><div id="app">
<header id="topbar"><div class="brand"><div class="logo">B</div><div><b>BSP-SMS</b><small>School Productivity Hub</small></div></div><div class="tools"><button id="minBtn" title="Minimize">−</button><button id="closeBtn" title="Close">×</button></div></header>
<main id="mainView">
<section class="hero">
<div class="hero-logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.4 9 2.4 12 0v-5"/></svg></div>
<div class="hero-text"><span class="eyebrow">YOUR WORKSPACE</span><h1>Choose a tool</h1><p>Every tool opens in its own floating window above the portal.</p></div>
</section>
<label class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search" placeholder="Search tools..." autocomplete="off"></label>
<div id="cards" class="cards"></div>
<div id="emptyMsg" class="empty" hidden>No tool matches your search.</div>
<footer><span id="toolCount">8 tools available</span><span>v1.1.0</span></footer>
</main>
<section id="toolView" hidden><div class="toolbar"><button id="backBtn">← BACK</button><strong id="toolTitle">Extension</strong><button id="toolMin">−</button></div><iframe id="toolFrame" title="Extension tool"></iframe></section>
</div><script src="hub.js"></script></body></html>
